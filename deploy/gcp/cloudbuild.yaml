# Run from the repository root; no .env or provider keys are uploaded.
steps:
  - name: gcr.io/cloud-builders/docker
    id: backend
    args: [build, -f, backend/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}', backend]
  - name: gcr.io/cloud-builders/docker
    id: frontend
    waitFor: ['-']
    args: [build, --target, production, -f, frontend/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}', frontend]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}'
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: corten
  _TAG: review
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
