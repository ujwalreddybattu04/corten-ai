events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  server_tokens off;
  set_real_ip_from 172.31.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
  limit_req_status 429;
  client_max_body_size 12m;
  server {
    listen 8080;
    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    # Space knowledge files may be up to 25 MB; every other request keeps the 12 MB limit.
    location ~ ^/api/v1/spaces/[^/]+/files$ {
      client_max_body_size 26m;
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection '';
      proxy_request_buffering on;
      proxy_read_timeout 300s;
    }
    location /api/v1/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
