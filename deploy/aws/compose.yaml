name: corten
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: /opt/corten/private/postgres.env
    volumes:
      - /opt/corten/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U corten -d corten_ai']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: local
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes:
      - /opt/corten/private/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /opt/corten/data/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis-password)" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    secrets: [redis-password]
    logging: *logging
  backend:
    build: {context: ../../backend}
    restart: unless-stopped
    user: '10001:10001'
    env_file: /opt/corten/private/backend.env
    environment:
      RUN_STARTUP_MIGRATIONS: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    volumes:
      - /opt/corten/data/reports:/app/reports
      - /opt/corten/data/space-files:/app/space-files
      - /run/corten-bedrock:/run/corten-bedrock:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)']
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 30s
    logging: *logging
  frontend:
    build: {context: ../../frontend, target: production}
    restart: unless-stopped
    user: '1000:1000'
    env_file: /opt/corten/private/frontend.env
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ''
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777', '/app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/v1/search/status").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 20s
      timeout: 7s
      retries: 8
    logging: *logging
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['80:8080']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: {condition: service_healthy}
    logging: *logging
secrets:
  redis-password:
    file: /opt/corten/private/redis-password
